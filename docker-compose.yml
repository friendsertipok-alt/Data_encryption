services:
  dlp-gateway:
    build: .
    container_name: dlp-gateway
    ports:
      - "8001:8001"
    environment:
      - DLP_HOST=0.0.0.0
      - DLP_PORT=8001
      - ENABLE_AUTH=false
      - API_KEYS=test_key_123
      - SECRET_KEY=dlp_master_secret_key_2026_aes256_fernet_docker_token_32b=
      - SESSION_TTL_HOURS=24
    volumes:
      - ./data:/app/data
      - ./audit.log:/app/audit.log
    restart: always
